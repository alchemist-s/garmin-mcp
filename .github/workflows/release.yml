name: Release bundle

# Builds the Claude Desktop bundle and attaches it to a GitHub release, so the
# download link people click is a real artifact rather than a repo zip.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Run tests
        run: uv run --frozen pytest -q

      - name: Validate manifest
        run: npx -y @anthropic-ai/mcpb@2 validate manifest.json

      - name: Pack bundle
        run: npx -y @anthropic-ai/mcpb@2 pack . dist/garmin-connect.mcpb

      - name: Attach to release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/garmin-connect.mcpb
          generate_release_notes: true
