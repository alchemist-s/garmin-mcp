[project]
name = "garmin-mcp"
version = "0.2.0"
description = "MCP server for Garmin Connect health, sleep, training and activity data"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["garmin", "mcp", "health", "fitness", "sleep"]
authors = [
    { name = "Shahed", email = "alchemist-s@users.noreply.github.com" }
]
requires-python = ">=3.11"
dependencies = [
    "garminconnect>=0.3.2",
    "mcp[cli]>=2.0.0",
]

[project.urls]
Homepage = "https://github.com/alchemist-s/garmin-mcp"
Repository = "https://github.com/alchemist-s/garmin-mcp"
Issues = "https://github.com/alchemist-s/garmin-mcp/issues"

[project.scripts]
garmin-mcp = "garmin_mcp.cli:main"

[build-system]
requires = ["uv_build>=0.11.16,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "anyio>=4.15.1",
    "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
