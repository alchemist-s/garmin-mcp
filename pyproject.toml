[project]
name = "zonetwo"
version = "0.4.1"
description = "Zone Two — your training log in conversation. Reads Garmin Connect health, sleep, training and activity data."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["garmin", "mcp", "health", "fitness", "sleep"]
authors = [
    { name = "Shahed", email = "alchemist-s@users.noreply.github.com" }
]
requires-python = ">=3.11"
dependencies = [
    "garminconnect>=0.3.2",
    "mcp[cli]>=2.0.0",
]

[project.urls]
Homepage = "https://zonetwo.vercel.app"
Repository = "https://github.com/alchemist-s/zonetwo"
Issues = "https://github.com/alchemist-s/zonetwo/issues"

[project.scripts]
zonetwo = "zonetwo.cli:main"

[build-system]
requires = ["uv_build>=0.11.16,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "anyio>=4.15.1",
    "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
